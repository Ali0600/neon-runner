name: CI

on:
  pull_request:
  workflow_dispatch:

# Least privilege: this workflow only ever reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches the development runtime. Never newer than what the project
          # is actually developed on, or CI green stops predicting local green.
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
