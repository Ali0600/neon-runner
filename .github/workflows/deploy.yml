name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time. Queue rather than cancel, so a merge
# is never dropped in favour of a later one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build
        env:
          # Stamped into the bundle so a live URL can be checked for the exact
          # commit it is serving. Pages answers unknown paths with 200s, so a
          # successful fetch alone proves nothing about what was deployed.
          GITHUB_SHA: ${{ github.sha }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: deploy to Pages
    # The gate: publishing waits for tests and build rather than racing them.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
